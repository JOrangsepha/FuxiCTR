### Tiny data for CPU smoke tests
tiny_parquet:
    data_root: ../../data/
    data_format: parquet
    train_data: ../../data/tiny_parquet/train.parquet
    valid_data: ../../data/tiny_parquet/valid.parquet
    test_data: ../../data/tiny_parquet/test.parquet

### Criteo_x1, the public single-task split used by BARS / reczoo.
### Download: https://huggingface.co/datasets/reczoo/Criteo_x1
### Place train.csv, valid.csv, test.csv under ../../data/Criteo/Criteo_x1/
Criteo_x1:
    data_format: csv
    data_root: ../../data/Criteo/
    train_data: ../../data/Criteo/Criteo_x1/train.csv
    valid_data: ../../data/Criteo/Criteo_x1/valid.csv
    test_data: ../../data/Criteo/Criteo_x1/test.csv
    min_categr_count: 1
    feature_cols:
        - {active: true, dtype: float, type: numeric,
           name: [I1, I2, I3, I4, I5, I6, I7, I8, I9, I10, I11, I12, I13]}
        - {active: true, dtype: float, type: categorical,
           name: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13, C14, C15, C16,
                  C17, C18, C19, C20, C21, C22, C23, C24, C25, C26]}
    label_col: {dtype: float, name: label}
