### Semantic-group ablation on Ali-CCP: user profile / item / shop-context.
### token_dim 48 is divisible by T = 3.
MTRankMixer_aliccp_semantic:
    model: MTRankMixer
    dataset_id: AliCCP_x1
    loss: ['binary_crossentropy', 'binary_crossentropy']
    metrics: ['logloss', 'AUC']
    task: ['binary_classification', 'binary_classification']
    num_tasks: 2
    loss_weight: EQ
    optimizer: adam
    learning_rate: 1.0e-3
    embedding_regularizer: 0
    net_regularizer: 0
    batch_size: 8192
    embedding_dim: 16
    num_tokens: 3
    token_dim: 48
    num_layers: 2
    ffn_multiplier: 2
    token_grouping: semantic
    feature_groups:
        - ["101", "121", "122", "124", "125", "126", "127", "128", "129"]
        - ["205", "206", "207", "216"]
        - ["508", "509", "702", "853", "301"]
    gate_type: softmax
    tower_hidden_units: [64]
    tower_hidden_activations: relu
    tower_batch_norm: false
    use_sparse_moe: false
    num_experts: 4
    moe_lambda: 1.0e-3
    net_dropout: 0
    epochs: 1
    shuffle: True
    seed: 2025
    monitor: 'AUC'
    monitor_mode: 'max'
    num_workers: 4
