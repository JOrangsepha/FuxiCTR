Base:
    model_root: './checkpoints/'
    num_workers: 3
    verbose: 1
    early_stop_patience: 2
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: null
    use_features: null
    feature_specs: null
    feature_config: null

### CPU smoke test. Sequential tokenization, shared RankMixer trunk, per-task softmax gates.
MTRankMixer_test:
    model: MTRankMixer
    dataset_id: tiny_mtl
    loss: ['binary_crossentropy', 'binary_crossentropy']
    metrics: ['logloss', 'AUC']
    task: ['binary_classification', 'binary_classification']
    num_tasks: 2
    loss_weight: EQ
    optimizer: adam
    learning_rate: 1.0e-3
    embedding_regularizer: 0
    net_regularizer: 0
    batch_size: 32
    embedding_dim: 8
    num_tokens: 4
    token_dim: 32
    num_layers: 1
    ffn_multiplier: 2
    token_grouping: sequential
    feature_groups: null
    gate_type: softmax
    tower_hidden_units: [32]
    tower_hidden_activations: relu
    tower_batch_norm: false
    use_sparse_moe: false
    num_experts: 2
    moe_lambda: 1.0e-3
    net_dropout: 0
    epochs: 1
    shuffle: True
    seed: 2025
    monitor: 'AUC'
    monitor_mode: 'max'
    num_workers: 0

### Same tiny multi-task data with explicit semantic feature groups (an ablation switch).
MTRankMixer_group_test:
    model: MTRankMixer
    dataset_id: tiny_mtl
    loss: ['binary_crossentropy', 'binary_crossentropy']
    metrics: ['logloss', 'AUC']
    task: ['binary_classification', 'binary_classification']
    num_tasks: 2
    loss_weight: EQ
    optimizer: adam
    learning_rate: 1.0e-3
    embedding_regularizer: 0
    net_regularizer: 0
    batch_size: 32
    embedding_dim: 8
    num_tokens: 2
    token_dim: 32
    num_layers: 1
    ffn_multiplier: 2
    token_grouping: semantic
    feature_groups:
        - [categorical_1, categorical_2, categorical_3, categorical_4, categorical_5, categorical_6,
           categorical_7, categorical_8, categorical_9, categorical_10, categorical_11, categorical_12,
           categorical_13, categorical_14, categorical_15, categorical_16]
        - [numerical_1, numerical_2, numerical_3, numerical_4, numerical_5, numerical_6, numerical_7,
           numerical_8, numerical_9, numerical_10, numerical_11, numerical_12, numerical_13, numerical_14,
           numerical_15, numerical_16, numerical_17, numerical_18, numerical_19, numerical_20, numerical_21,
           numerical_22, numerical_23, numerical_24, numerical_25, numerical_26, numerical_27, numerical_28,
           numerical_29, numerical_30, numerical_31, numerical_32, numerical_33, numerical_34, numerical_35,
           numerical_36, numerical_37, numerical_38, numerical_39, numerical_40, numerical_41, numerical_42,
           numerical_43, numerical_44, numerical_45, numerical_46, numerical_47, numerical_48, numerical_49,
           numerical_50, numerical_51, numerical_52, numerical_53, numerical_54, numerical_55, numerical_56,
           numerical_57, numerical_58, numerical_59, numerical_60, numerical_61, numerical_62, numerical_63]
    gate_type: sigmoid
    tower_hidden_units: [32]
    tower_hidden_activations: relu
    tower_batch_norm: false
    use_sparse_moe: false
    num_experts: 2
    moe_lambda: 1.0e-3
    net_dropout: 0
    epochs: 1
    shuffle: True
    seed: 2025
    monitor: 'AUC'
    monitor_mode: 'max'
    num_workers: 0

