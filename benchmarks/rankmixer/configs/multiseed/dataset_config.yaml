# Ali-CCP already preprocessed on the training machine.
# Do not point this at the CSV and do not rebuild feature_map.json.
# Paths are relative to model_zoo/multitask/{MT_RankMixer,PLE}, where run_expid.py chdirs.
AliCCP_x1:
    data_root: ../../../data/AliCCP/
    data_format: parquet
    train_data: ../../../data/AliCCP/AliCCP_x1/train.parquet
    valid_data: ../../../data/AliCCP/AliCCP_x1/valid.parquet
    test_data: ../../../data/AliCCP/AliCCP_x1/test.parquet
    min_categr_count: 10
    feature_cols:
        - {active: true, dtype: str, type: categorical,
           name: ["101", "121", "122", "124", "125", "126", "127", "128", "129",
                  "205", "206", "207", "216", "508", "509", "702", "853", "301"]}
    label_col:
        - {name: click, dtype: float}
        - {name: conversion, dtype: float}
