### PLE baseline, same optimizer / batch / embedding / early-stop budget.
PLE_aliccp_es:
    model: PLE
    dataset_id: AliCCP_x1
    loss: ['binary_crossentropy', 'binary_crossentropy']
    metrics: ['logloss', 'AUC']
    task: ['binary_classification', 'binary_classification']
    num_tasks: 2
    optimizer: adam
    learning_rate: 1.0e-3
    num_layers: 1
    num_shared_experts: 2
    num_specific_experts: 2
    expert_hidden_units: [128, 64]
    gate_hidden_units: [64]
    tower_hidden_units: [64]
    hidden_activations: relu
    net_regularizer: 0
    embedding_regularizer: 0
    batch_norm: False
    net_dropout: 0
    batch_size: 8192
    embedding_dim: 16
    epochs: 6
    shuffle: True
    seed: 2025
    monitor: 'AUC'
    monitor_mode: 'max'
