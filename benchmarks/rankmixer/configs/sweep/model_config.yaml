# Improvement sweep on AliCCP_x1. run_sweep.sh clones each expid once per seed.
# Recorded server expids are MTR_sw_<variant>_s{2025,2026,2027}.
#
# Six semantic tokens, in order:
#   0 user id            101
#   1 user profile       121,122,124,125,126,127,128,129
#   2 item id            205
#   3 item cat/shop/brand 206,207,216
#   4 cross features     508,509,702,853
#   5 scenario           301
# token_dim 48 is divisible by both 3 and 6.
#
# Monitor: MultiTaskModel.evaluate writes the unweighted mean of click AUC and
# conversion AUC under the bare key AUC.
Base:
    model_root: /root/autodl-tmp/sw_out/checkpoints
    num_workers: 4
    verbose: 1
    early_stop_patience: 1
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: null
    use_features: null
    feature_specs: null
    feature_config: null

MTR_sw_g6_residual:
    model: MTRankMixer
    dataset_id: AliCCP_x1
    loss: ['binary_crossentropy', 'binary_crossentropy']
    metrics: ['logloss', 'AUC']
    task: ['binary_classification', 'binary_classification']
    num_tasks: 2
    loss_weight: EQ
    optimizer: adam
    learning_rate: 1.0e-3
    embedding_regularizer: 0
    net_regularizer: 0
    batch_size: 8192
    embedding_dim: 16
    num_tokens: 6
    token_dim: 48
    num_layers: 2
    ffn_multiplier: 2
    token_grouping: semantic
    feature_groups:
        - ["101"]
        - ["121", "122", "124", "125", "126", "127", "128", "129"]
        - ["205"]
        - ["206", "207", "216"]
        - ["508", "509", "702", "853"]
        - ["301"]
    gate_type: softmax
    task_pooling: residual
    gate_entropy_reg: 0
    gate_temperature: 1.0
    tower_hidden_units: [64]
    tower_hidden_activations: relu
    tower_batch_norm: false
    use_sparse_moe: false
    num_experts: 4
    moe_lambda: 1.0e-3
    net_dropout: 0
    epochs: 6
    shuffle: True
    seed: 2025
    monitor: 'AUC'
    monitor_mode: 'max'
    num_workers: 4

