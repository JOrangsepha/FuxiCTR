# Follow-up suite on AliCCP_x1 (run_followup.sh). Same protocol as configs/rigor:
# --skip_test training, selection on validation only, test read once at the end.
#
# 1) Loss normalisation. Identical to the rigor g6_mean / g6_gate / g6_residual
#    blocks except loss_weight: NORM. In MultiTaskModel.combine_task_losses,
#    NORM returns sum_k L_k / stopgrad(|L_k|), so the logged training loss is
#    exactly num_tasks (2.0) and task k's gradient is grad(L_k) / L_k. With
#    click BCE ~0.16 and conversion BCE ~0.002 on Ali-CCP, this up-weights the
#    conversion gradient by roughly L_click / L_conv (~80x) relative to EQ.
#
# 2) PLE tuning budget. Same data, embedding_dim 16, batch 8192, Adam,
#    epochs <= 10, patience 3, no regularisation as every MT-RankMixer config.
#    Three single-change configs, chosen on validation only:
#      PLE_fu_wide    expert_hidden_units [256, 128] (baseline [128, 64])
#      PLE_fu_lr5e4   learning_rate 5e-4 (baseline 1e-3)
#      PLE_fu_drop01  net_dropout 0.1 (baseline 0)
#    The rigor PLE_rg baseline (seeds 2025-2027) is the fourth candidate.

# Base.model_root below is the AutoDL path used for the recorded run.
# run_followup.sh overrides it with prepare_multiseed_config.py --model-root
# (default $OUT/checkpoints, OUT defaults to /root/autodl-tmp/fu_out).
Base:
    model_root: /root/autodl-tmp/fu_out/checkpoints
    num_workers: 4
    verbose: 1
    early_stop_patience: 3
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: null
    use_features: null
    feature_specs: null
    feature_config: null

x-groups-g6: &groups_g6
    - ["101"]
    - ["121", "122", "124", "125", "126", "127", "128", "129"]
    - ["205"]
    - ["206", "207", "216"]
    - ["508", "509", "702", "853"]
    - ["301"]

x-mt: &mt
    model: MTRankMixer
    dataset_id: AliCCP_x1
    loss: ['binary_crossentropy', 'binary_crossentropy']
    metrics: ['logloss', 'AUC']
    task: ['binary_classification', 'binary_classification']
    num_tasks: 2
    loss_weight: NORM
    optimizer: adam
    learning_rate: 1.0e-3
    embedding_regularizer: 0
    net_regularizer: 0
    batch_size: 8192
    embedding_dim: 16
    token_dim: 48
    num_layers: 2
    ffn_multiplier: 2
    token_grouping: semantic
    gate_entropy_reg: 0
    gate_temperature: 1.0
    tower_hidden_units: [64]
    tower_hidden_activations: relu
    tower_batch_norm: false
    use_sparse_moe: false
    num_experts: 4
    moe_lambda: 1.0e-3
    net_dropout: 0
    epochs: 10
    shuffle: True
    seed: 2025
    monitor: 'AUC'
    monitor_mode: 'max'

MTR_fu_g6_mean_norm:
    <<: *mt
    num_tokens: 6
    feature_groups: *groups_g6
    gate_type: mean
    task_pooling: mean

MTR_fu_g6_residual_norm:
    <<: *mt
    num_tokens: 6
    feature_groups: *groups_g6
    gate_type: softmax
    task_pooling: residual

MTR_fu_g6_gate_norm:
    <<: *mt
    num_tokens: 6
    feature_groups: *groups_g6
    gate_type: softmax
    task_pooling: gate

# Staged alternative, NOT queued by default (see run_followup.sh NORM_SET):
# manual weights [click, conversion] = [1, 10], which roughly equalises the
# measured EQ trunk-gradient gap (click ~10.7x conversion, grad_audit.md).
# Unlike per-batch NORM, a constant weight keeps the BCE gradient (p - y),
# which vanishes as p -> 0, so it cannot drive the conversion logits to -inf
# on batches that contain no conversion.
MTR_fu_g6_mean_w10:
    <<: *mt
    loss_weight: [1.0, 10.0]
    num_tokens: 6
    feature_groups: *groups_g6
    gate_type: mean
    task_pooling: mean

MTR_fu_g6_residual_w10:
    <<: *mt
    loss_weight: [1.0, 10.0]
    num_tokens: 6
    feature_groups: *groups_g6
    gate_type: softmax
    task_pooling: residual

MTR_fu_g6_gate_w10:
    <<: *mt
    loss_weight: [1.0, 10.0]
    num_tokens: 6
    feature_groups: *groups_g6
    gate_type: softmax
    task_pooling: gate

x-ple: &ple
    model: PLE
    dataset_id: AliCCP_x1
    loss: ['binary_crossentropy', 'binary_crossentropy']
    metrics: ['logloss', 'AUC']
    task: ['binary_classification', 'binary_classification']
    num_tasks: 2
    loss_weight: EQ
    optimizer: adam
    learning_rate: 1.0e-3
    num_layers: 1
    num_shared_experts: 2
    num_specific_experts: 2
    expert_hidden_units: [128, 64]
    gate_hidden_units: [64]
    tower_hidden_units: [64]
    hidden_activations: relu
    net_regularizer: 0
    embedding_regularizer: 0
    batch_norm: False
    net_dropout: 0
    batch_size: 8192
    embedding_dim: 16
    epochs: 10
    shuffle: True
    seed: 2025
    monitor: 'AUC'
    monitor_mode: 'max'

PLE_fu_wide:
    <<: *ple
    expert_hidden_units: [256, 128]

PLE_fu_lr5e4:
    <<: *ple
    learning_rate: 5.0e-4

PLE_fu_drop01:
    <<: *ple
    net_dropout: 0.1
