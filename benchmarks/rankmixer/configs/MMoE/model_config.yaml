Base:
    model_root: './checkpoints/'
    num_workers: 4
    verbose: 1
    early_stop_patience: 2
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: null
    use_features: null
    feature_specs: null
    feature_config: null

MMoE_aliccp:
    model: MMoE
    dataset_id: AliCCP_x1
    loss: ['binary_crossentropy', 'binary_crossentropy']
    metrics: ['logloss', 'AUC']
    task: ['binary_classification', 'binary_classification']
    num_tasks: 2
    optimizer: adam
    learning_rate: 1.0e-3
    num_experts: 4
    expert_hidden_units: [128, 64]
    gate_hidden_units: [64]
    tower_hidden_units: [64]
    hidden_activations: relu
    net_regularizer: 0
    embedding_regularizer: 0
    batch_norm: False
    net_dropout: 0
    batch_size: 8192
    embedding_dim: 16
    epochs: 1
    shuffle: True
    seed: 2025
    monitor: 'AUC'
    monitor_mode: 'max'
