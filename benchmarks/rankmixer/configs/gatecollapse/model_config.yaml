# Gate-collapse ablation on AliCCP_x1.
# run_gatecollapse.sh clones each expid once per seed.
#
# Protocol: the driver passes --skip_test. Early stopping watches validation.
# Gate analysis uses --stage valid. This suite does not read test.
#
# Budget matches the rigor suite: batch 8192, embedding 16, Adam 1e-3,
# epochs <= 10, early_stop_patience 3 (Base), loss_weight EQ.
# Six semantic tokens, same groups as MTR_rg_g6_gate.
#
# The recorded run set REUSE_BASELINE=1 and copied rigor checkpoints
# MTR_rg_g6_gate_s{2025..2029} onto MTR_gc_g6_gate_s*. GC_EXTRA defaults
# to 0, so MTR_gc_g6_residual_ent0003 was not trained.
#
# Variants actually summarized in results/gatecollapse/results.md:
#   MTR_gc_g6_gate                 EQ gate, reused rigor baseline
#   MTR_gc_g6_gate_ent0001         gate, entropy β=0.001
#   MTR_gc_g6_gate_ent0003         gate, entropy β=0.003
#   MTR_gc_g6_gate_ent001          gate, entropy β=0.01
#   MTR_gc_g6_gate_T2              gate, temperature T=2
#   MTR_gc_g6_gate_T4              gate, temperature T=4
#   MTR_gc_g6_gate_ent001_T2       gate, β=0.01 and T=2
#   MTR_gc_g6_residual_ent001      residual, entropy β=0.01

Base:
    model_root: /root/autodl-tmp/gc_out/checkpoints
    num_workers: 4
    verbose: 1
    early_stop_patience: 3
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: null
    use_features: null
    feature_specs: null
    feature_config: null

x-groups-g6: &groups_g6
    - ["101"]
    - ["121", "122", "124", "125", "126", "127", "128", "129"]
    - ["205"]
    - ["206", "207", "216"]
    - ["508", "509", "702", "853"]
    - ["301"]

x-mt: &mt
    model: MTRankMixer
    dataset_id: AliCCP_x1
    loss: ['binary_crossentropy', 'binary_crossentropy']
    metrics: ['logloss', 'AUC']
    task: ['binary_classification', 'binary_classification']
    num_tasks: 2
    loss_weight: EQ
    optimizer: adam
    learning_rate: 1.0e-3
    embedding_regularizer: 0
    net_regularizer: 0
    batch_size: 8192
    embedding_dim: 16
    num_tokens: 6
    token_dim: 48
    num_layers: 2
    ffn_multiplier: 2
    token_grouping: semantic
    feature_groups: *groups_g6
    gate_type: softmax
    tower_hidden_units: [64]
    tower_hidden_activations: relu
    tower_batch_norm: false
    use_sparse_moe: false
    num_experts: 4
    moe_lambda: 1.0e-3
    net_dropout: 0
    epochs: 10
    shuffle: True
    seed: 2025
    monitor: 'AUC'
    monitor_mode: 'max'

MTR_gc_g6_gate:
    <<: *mt
    task_pooling: gate
    gate_entropy_reg: 0
    gate_temperature: 1.0

MTR_gc_g6_gate_ent0001:
    <<: *mt
    task_pooling: gate
    gate_entropy_reg: 0.001
    gate_temperature: 1.0

MTR_gc_g6_gate_ent0003:
    <<: *mt
    task_pooling: gate
    gate_entropy_reg: 0.003
    gate_temperature: 1.0

MTR_gc_g6_gate_ent001:
    <<: *mt
    task_pooling: gate
    gate_entropy_reg: 0.01
    gate_temperature: 1.0

MTR_gc_g6_gate_T2:
    <<: *mt
    task_pooling: gate
    gate_entropy_reg: 0
    gate_temperature: 2.0

MTR_gc_g6_gate_T4:
    <<: *mt
    task_pooling: gate
    gate_entropy_reg: 0
    gate_temperature: 4.0

MTR_gc_g6_gate_ent001_T2:
    <<: *mt
    task_pooling: gate
    gate_entropy_reg: 0.01
    gate_temperature: 2.0

MTR_gc_g6_residual_ent001:
    <<: *mt
    task_pooling: residual
    gate_entropy_reg: 0.01
    gate_temperature: 1.0

# Not in the recorded summary. Trained only when GC_EXTRA=1.
MTR_gc_g6_residual_ent0003:
    <<: *mt
    task_pooling: residual
    gate_entropy_reg: 0.003
    gate_temperature: 1.0
