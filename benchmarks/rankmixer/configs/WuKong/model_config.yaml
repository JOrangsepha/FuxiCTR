Base:
    model_root: './checkpoints/'
    num_workers: 4
    verbose: 1
    early_stop_patience: 2
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: null
    use_features: null
    feature_specs: null
    feature_config: null

WuKong_criteo_x1:
    model: WuKong
    dataset_id: Criteo_x1
    loss: 'binary_crossentropy'
    metrics: ['logloss', 'AUC']
    task: binary_classification
    optimizer: adam
    learning_rate: 1.0e-3
    embedding_regularizer: 0
    net_regularizer: 0
    batch_size: 8192
    embedding_dim: 16
    num_wukong_layers: 2
    lcb_features: 16
    fmb_features: 16
    fmb_mlp_units: [128, 64]
    fmb_mlp_activations: relu
    fmp_rank_k: 8
    mlp_hidden_units: [128, 64]
    mlp_hidden_activations: relu
    mlp_batch_norm: False
    layer_norm: True
    net_dropout: 0
    epochs: 1
    shuffle: True
    seed: 2025
    monitor: 'AUC'
    monitor_mode: 'max'
